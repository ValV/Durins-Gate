name: Android CI Build

on:
  push:
    branches:
      - 'feature/*'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HAS_SIGNING_KEYS: ${{ secrets.SIGNING_KEY != '' && secrets.ALIAS != '' }}

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Metadata & Plan
        id: vars
        shell: bash
        run: |
          echo "--- Workflow Plan ---"
          REF_NAME="${{ github.ref_name }}"
          RUN_NUMBER="${{ github.run_number }}"

          # Extract version from Gradle
          VERSION=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'\"' '{print $2}')
          if [ -z "$VERSION" ]; then VERSION="1.0-manual"; fi

          echo "Target Ref: $REF_NAME"
          echo "App Version: $VERSION"

          if [[ ${{ github.ref }} == refs/tags/* ]]; then
            echo "Build Type: RELEASE"
            TAG="$REF_NAME"
            RELEASE_NAME="Release $TAG"
            IS_PRERELEASE="false"
            SHOULD_RELEASE="true"
            APK_SUFFIX="release"
          else
            echo "Build Type: FEATURE"
            # Clean branch name for artifact safety
            SAFE_BRANCH="${REF_NAME//\//-}"
            TAG="${SAFE_BRANCH}-b${RUN_NUMBER}"
            RELEASE_NAME="Feature Build #${RUN_NUMBER} ($REF_NAME)"
            IS_PRERELEASE="true"
            SHOULD_RELEASE="false"
            APK_SUFFIX="feature"
          fi

          echo "Final Tag: $TAG"
          echo "Release Name: $RELEASE_NAME"

          # Export for following steps
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "SHOULD_RELEASE=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "APK_SUFFIX=$APK_SUFFIX" >> $GITHUB_OUTPUT
          echo "RUN_NUMBER=$RUN_NUMBER" >> $GITHUB_OUTPUT

          echo "---------------------"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --info --stacktrace

      - name: Sign App APK
        if: ${{ env.HAS_SIGNING_KEYS == 'true' }}
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK with Comprehensive Metadata
        shell: bash
        run: |
          # Define naming variables
          VERSION="${{ steps.vars.outputs.VERSION }}"
          TAG="${{ steps.vars.outputs.TAG }}"
          RUN_NUMBER="${{ steps.vars.outputs.RUN_NUMBER }}"
          APK_SUFFIX="${{ steps.vars.outputs.APK_SUFFIX }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:8}"

          # --- SELECT SIGNED OR FALLBACK TO UNSIGNED APK ---
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          if [ -n "$SIGNED_APK" ] && [ -f "$SIGNED_APK" ]; then
            ORIGINAL_APK="$SIGNED_APK"
            echo "Using cryptographically signed APK."
          else
            ORIGINAL_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            echo "Signing keys are missing or run skipped. Falling back to unsigned APK."
          fi

          if [ -f "$ORIGINAL_APK" ]; then
            NEW_APK_NAME="DurinsGate-${TAG}.apk"
            NEW_APK_PATH="app/build/outputs/apk/release/${NEW_APK_NAME}"
            mv "$ORIGINAL_APK" "$NEW_APK_PATH"
            echo "APK renamed to: $NEW_APK_NAME"
            echo "APK_NAME=$NEW_APK_NAME" >> $GITHUB_ENV
          else
            echo "Error: Target APK not found at $ORIGINAL_APK"
            exit 1
          fi

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DurinsGate-APK-v${{ steps.vars.outputs.VERSION }}-b${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Create GitHub Release
        if: steps.vars.outputs.SHOULD_RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/release/*.apk"
          tag: ${{ steps.vars.outputs.TAG }}
          name: ${{ steps.vars.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.vars.outputs.IS_PRERELEASE }}
          body: |
            ### Build Information
            - **Version**: ${{ steps.vars.outputs.VERSION }}
            - **Build Number**: ${{ github.run_number }}
            - **Commit**: ${{ github.sha }}
            - **Tag**: ${{ steps.vars.outputs.TAG }}
            - **APK Name**: ${{ env.APK_NAME }}

            *Automated build generated by GitHub Actions.*
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
