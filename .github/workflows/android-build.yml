name: Android CI Build

on:
  push:
    branches:
      - 'feature/*'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Metadata & Plan
        id: vars
        shell: bash
        run: |
          echo "--- Workflow Plan ---"
          REF_NAME="${{ github.ref_name }}"
          RUN_NUMBER="${{ github.run_number }}"

          # Extract version from Gradle
          VERSION=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'\"' '{print $2}')
          if [ -z "$VERSION" ]; then VERSION="1.0-manual"; fi

          echo "Target Ref: $REF_NAME"
          echo "App Version: $VERSION"

          if [[ ${{ github.ref }} == refs/tags/* ]]; then
            echo "Build Type: RELEASE"
            TAG="$REF_NAME"
            RELEASE_NAME="Release $TAG"
            IS_PRERELEASE="false"
            SHOULD_RELEASE="true"
          else
            echo "Build Type: FEATURE"
            # Clean branch name for artifact safety
            SAFE_BRANCH="${REF_NAME//\//-}"
            TAG="feat-${SAFE_BRANCH}-${RUN_NUMBER}"
            RELEASE_NAME="Feature Build #${RUN_NUMBER} ($REF_NAME)"
            IS_PRERELEASE="true"
            SHOULD_RELEASE="false"
          fi

          echo "Final Tag: $TAG"
          echo "Release Name: $RELEASE_NAME"

          # Export for following steps
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "SHOULD_RELEASE=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "---------------------"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --info --stacktrace

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DurinsGate-APK-v${{ steps.vars.outputs.VERSION }}-b${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Create GitHub Release
        if: steps.vars.outputs.SHOULD_RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/release/*.apk"
          tag: ${{ steps.vars.outputs.TAG }}
          name: ${{ steps.vars.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.vars.outputs.IS_PRERELEASE }}
          body: |
            ### Build Information
            - **Ref:** `${{ github.ref_name }}`
            - **Commit:** `${{ github.sha }}`
            - **Version:** `${{ steps.vars.outputs.VERSION }}`
            - **Build ID:** `${{ github.run_id }}`

            *Automated build generated by GitHub Actions.*
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
